# stanradar configuration.
#
# Copy to config.yaml and edit. config.yaml is gitignored, config.example.yaml is not,
# so keep secrets out of here - use ${ENV_VAR} and put the value in .env.

poll_interval_seconds: 60        # 60s is polite and still beats almost everyone to a listing
request_timeout_seconds: 25
max_detail_fetches_per_cycle: 25 # cap on detail-page requests per portal per cycle
fingerprint_ttl_hours: 72        # how long to suppress the same flat re-posted elsewhere
database_path: data/stanradar.db

# Run `stanradar sources` to see what is available and what is not implemented yet.
sources:
  - fourzida
  - nekretnine
  - oglasi
  - kupujemprodajem
  # - halooglasi
  #
  # Disabled only because this runs on GitHub Actions. Measured on a real run: halooglasi
  # returns HTTP 403 to GitHub's Azure runners, while the other four are fine - including
  # nekretnine.rs, which uses the same class of TLS-fingerprinting WAF. That makes it IP
  # reputation rather than fingerprinting, so a different impersonation profile will not
  # help. Left enabled it would fail every cycle forever and keep `errors` permanently at 1.
  #
  # It works perfectly from a home connection or a VPS. If you move off Actions, delete the
  # '# ' above and it comes straight back.

criteria:
  # READ THIS BEFORE WIDENING THE BUDGET.
  # Belgrade has ~3,500 flats listed for rent at any time. Only ~116 of them are under
  # 400 EUR, and in Novi Beograd specifically there are about 7 in the 350-400 band and 3
  # below 350. So expect a handful of alerts a month, not a day. That is not the monitor
  # failing - it is the market, and it is exactly why being first to call matters.
  # The commute radius below is what makes this workable: Cukarica (Banovo brdo, Zarkovo,
  # Julino brdo) and western Novi Beograd (Bezanijska kosa, Ledine) are both inside a
  # 20-minute ride and are materially cheaper than the central blocks.
  price_eur:
    # 200. Belgrade has ~13 listings in 200-250 and ~8 below 200; below 200 is almost
    # always a room rather than a flat, and the area and rooms filters catch those anyway.
    min: 200
    # 450 rather than 400. Measured on live data: 250-400 gives 108 Belgrade listings,
    # 250-450 gives 146 - so about a third more, not the doubling the full 400-500 band
    # count suggests. Within Novi Beograd proper it is only 9 -> 11; most of the gain is
    # in Cukarica and Zemun, which the commute radius covers. The score still ranks
    # cheaper flats higher, so a 440 EUR place must be visibly better to outrank a 380 one.
    max: 450
  area_m2:
    min: 30                      # at this budget, 30 m2 is a realistic floor
    max: 90
  rooms:
    # 0.5, not 1.0: 4zida encodes a garsonjera (studio) as roomCount 0.5 while the other
    # portals call it 1.0, so a floor of 1.0 silently dropped every 4zida studio - which at
    # this budget is a large part of what is actually available. Raise to 1.5 to require a
    # separate bedroom.
    min: 0.5
  floor:
    min: 0                       # 0 = ground floor; -1 is suteren, -2 is a cellar
  # Deliberately slack: with price capped at 450 and area floored at 30, the worst case is
  # already 15/m2, so this almost never binds. It is kept as a guard against bad data (a
  # mis-typed area turning a flat into a bargain), not as a real filter - at this budget an
  # extra redundant filter is a way to silently lose listings.
  max_price_per_m2: 15

  # 1, not 2: reject only ads with no photo at all. An empty flat has less to photograph,
  # and owner-posted ads (especially on kupujemprodajem) often carry a single picture - so
  # a floor of 2 was discarding exactly the cheap, owner-direct, empty listings you want.
  # "Suspiciously few photos" is a judgement, not a count, and the AI pass already treats
  # a missing kitchen or bathroom shot as a warning sign.
  min_images: 1
  owners_only: null              # null = both, true = owners only, false = agencies only

  # any | furnished | unfurnished. "any" because an empty flat is a real option when it is
  # cheap enough to pay for the furniture. Listings that never state it are always kept -
  # most do not say, and most portals have no structured field for it at all (only 4zida
  # and oglasi.rs do; the rest are detected from the text).
  furnished: any
  max_age_minutes: null          # null = no limit; 120 would mean "only the last 2 hours"

  # Travel-time radius to work, which is the real criterion - it correctly includes the
  # cheaper areas across the Sava that a district list would miss.
  # The minute estimates live in src/stanradar/commute.py and are hand-estimated, NOT
  # measured routes. Correct any of them here as you learn the city; `areas` is merged
  # over the defaults.
  commute:
    anchor: navigator            # Blok 43, Bul. Milutina Milankovica, Novi Beograd
    # 25, not 20, on purpose. The estimates are hand-made and easily +/-5 minutes out, and
    # the cheapest areas you can actually reach cluster just past 20: Bezanijska kosa and
    # Zarkovo at ~22, Ledine and Zemunske kapije at ~24. A hard 20 would cut out most of
    # what is affordable while only trimming a few minutes off the ride. Drop it to 20
    # once you have checked a few of these rides yourself and know the real numbers.
    max_minutes: 25
    areas: {}                    # corrections, e.g. {zarkovo: 18, ledine: 22}
    unknown: include             # include | exclude - see the note below

  # `unknown: include` means a listing in an area the table does not recognise still gets
  # through. That is deliberate: portals invent neighbourhood names constantly, and at this
  # budget you would much rather check a map than miss a flat. Switch to `exclude` only if
  # the noise becomes annoying.

  districts:
    # The commute radius does the geographic filtering now. These only adjust the *score*
    # within it, so keep them short. Matched as folded substrings, so "zarkovo" also
    # matches "Žarkovo".
    preferred:
      - blok 43
      - blok 44
      - blok 45
      - belville
      - banovo brdo
      - blok 70
      - dr ivana ribara
    acceptable:
      - novi beograd
      - zemun
      - cukarica
      - zarkovo
      - bezanijska kosa
    excluded:
      - borca
      - ovca
      - krnjaca
      - padinska skela
      - surcin
      - obrenovac
      - lazarevac
      - barajevo
      - mladenovac
      - grocka
      - sopot

  keywords:
    # If set, a listing must contain at least one of these. Empty = no requirement.
    required_any: []

    # Any of these disqualifies the listing outright.
    blocked:
      - na dan
      - dnevno izdavanje
      - kratkorocno
      - turisticko
      - suteren
      - podrumski
      - bez grejanja
      - sustanar
      - deljenje stana
      - krevet u
      - samo za studentkinje
      - samo za studente

    # Added to the score when present. Capped at 12 points in total, so padding a
    # description with amenity words cannot outrank a better flat described plainly.
    bonus:
      renoviran: 8
      novogradnja: 6
      lift: 5
      terasa: 4
      parking: 4
      garaza: 4
      klima: 3
      centralno grejanje: 4
      gradsko grejanje: 4
      # No washing-machine / dishwasher bonuses here on purpose. Only a furnished flat can
      # earn them, so they quietly ranked furnished above empty - and you treat both as
      # options. Fixtures that stay with the flat (lift, heating, A/C) are fair game.
      miran: 2
      svetao: 2
      ljubimci: 3

    # Subtracted when present.
    penalty:
      bez lifta: 5
      poslednji sprat: 3
      dvorisni: 4
      prolazna soba: 5
      etazno grejanje: 2        # on gas, this gets expensive in winter
      ta pec: 6                 # electric storage heater; expensive and slow

scoring:
  # Lowered from 60 because at this budget the pool is tiny - you want to see nearly
  # everything that clears the hard filters and judge it yourself. Raise it once you
  # are getting more alerts than you want to read.
  alert_threshold: 50

  llm:
    enabled: true               # needs ANTHROPIC_API_KEY; set false for rules-only
    model: claude-opus-5-5
    effort: low                 # low | medium | high | xhigh | max
    max_images: 4               # photos sent per listing
    min_rule_score: 40          # listings below this never reach the model
    # Free-text context the rules cannot express. This goes straight into the prompt.
    # EDIT THIS - it is the main thing that makes the AI scoring useful rather than generic.
    notes: |
      I work in Blok 43, Novi Beograd, and I commute by bus, so a short and simple ride
      matters - one bus with no change is much better than two.
      My budget is tight, up to about 450 EUR, so I care more about the flat being clean,
      honest and liveable than about it being large or modern.

      An unfurnished, empty flat is completely fine - I am willing to buy furniture if the
      rent is low enough to justify it, which for me means roughly under 350 EUR. So do not
      treat an empty flat as a negative. Do judge whether it is empty in a liveable way
      (working kitchen fittings, a real bathroom, floors and windows in good order) or empty
      because it is unfinished or run down, and say which. If the kitchen has no cabinets or
      no sink, that is a real cost and worth calling out.

      Flag anything that looks like the photos are hiding the real condition, and flag
      listings that are really rooms or shared flats advertised as whole apartments.

discord:
  webhook_url: ${DISCORD_WEBHOOK_URL}
  mention: ""                   # e.g. "@here" or "<@your_user_id>"
  # Lowered to match alert_threshold: at this budget a matching flat is rare enough that
  # you want the phone to buzz for it.
  mention_min_score: 65
